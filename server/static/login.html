<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Signify</title>
  <link rel="stylesheet" href="/styles/main.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --accent: #c2410c;
      --accent-hover: #9a3412;
      --text-dark: #1c1917;
      --text-muted: #78716c;
      --border-color: #e7e5e4;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07);
      width: 100%;
      max-width: 440px;
      padding: 36px;
      box-sizing: border-box;
    }
    .auth-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
      text-align: center;
    }
    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0 0 24px 0;
      text-align: center;
    }
    .tab-switcher {
      display: flex;
      background: #f5f5f4;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #ffffff;
      color: var(--text-dark);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: #ffffff;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }
    .btn-google:hover {
      background: #fafaf9;
      border-color: #d6d3d1;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider span {
      padding: 0 10px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .form-control:focus {
      border-color: var(--accent);
    }
    .password-wrapper {
      position: relative;
    }
    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
    }
    .alert-box {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 18px;
    }
    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .alert-success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>

  <header>
    <a href="/app.html" class="logo">Signify</a>
    <div class="kozha-nav-auth"></div>
  </header>

  <div class="main-container">
    <div class="auth-card">
      <h1 class="auth-title" id="auth-heading">Welcome Back</h1>
      <p class="auth-subtitle" id="auth-subheading">Sign in to access Signify Sign Translation</p>

      <div class="tab-switcher">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
      </div>

      <div id="alert-box" class="alert-box"></div>

      <!-- Google Sign In Button -->
      <button class="btn-google" type="button" onclick="handleGoogleSignIn()">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider">
        <span>or with email</span>
      </div>

      <form id="auth-form" onsubmit="handleFormSubmit(event)">
        <div class="form-group" id="name-group" style="display: none;">
          <label for="input-name">Full Name</label>
          <input type="text" id="input-name" class="form-control" placeholder="e.g. Sarah Signer">
        </div>

        <div class="form-group">
          <label for="input-email">Email Address</label>
          <input type="email" id="input-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="input-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="input-password" class="form-control" placeholder="••••••••" required>
            <button type="button" class="toggle-pass" onclick="togglePassword()">Show</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit-text">Sign In</button>
      </form>
    </div>
  </div>

  <script src="/static/auth.js"></script>
  <script>
    let currentMode = 'login';

    function switchTab(mode) {
      currentMode = mode;
      const heading = document.getElementById('auth-heading');
      const subheading = document.getElementById('auth-subheading');
      const nameGroup = document.getElementById('name-group');
      const btnSubmit = document.getElementById('btn-submit-text');
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      hideAlert();

      if (mode === 'signup') {
        heading.innerText = 'Create Account';
        subheading.innerText = 'Join Signify Sign Language Community';
        nameGroup.style.display = 'block';
        btnSubmit.innerText = 'Create Account';
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
      } else {
        heading.innerText = 'Welcome Back';
        subheading.innerText = 'Sign in to access Signify Sign Translation';
        nameGroup.style.display = 'none';
        btnSubmit.innerText = 'Sign In';
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
      }
    }

    function togglePassword() {
      const pass = document.getElementById('input-password');
      const btn = document.querySelector('.toggle-pass');
      if (pass.type === 'password') {
        pass.type = 'text';
        btn.innerText = 'Hide';
      } else {
        pass.type = 'password';
        btn.innerText = 'Show';
      }
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alert-box');
      box.innerText = msg;
      box.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
      box.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('alert-box').style.display = 'none';
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('input-email').value;
      const password = document.getElementById('input-password').value;
      const name = document.getElementById('input-name').value;

      try {
        if (currentMode === 'login') {
          await KozhaAuth.login(email, password);
          showAlert('Signed in successfully! Redirecting...', false);
        } else {
          await KozhaAuth.signup(email, password, name);
          showAlert('Account created successfully! Redirecting...', false);
        }
        setTimeout(() => {
          window.location.href = '/app.html';
        }, 1000);
      } catch (err) {
        showAlert(err.message || 'Authentication failed');
      }
    }

    async function handleGoogleSignIn() {
      hideAlert();
      try {
        const mockEmail = prompt("Enter your Google Account email:", "user@google.com");
        if (!mockEmail) return;
        const mockName = mockEmail.split('@')[0].replace('.', ' ').toUpperCase();
        await KozhaAuth.loginGooglePayload(mockEmail, mockName);
        showAlert('Google Sign-In successful! Redirecting...', false);
        setTimeout(() => {
          window.location.href = '/app.html';
        }, 1000);
      } catch (err) {
        showAlert(err.message || 'Google login failed');
      }
    }
  </script>
</body>
</html>
